name: Render across pandoc versions

## Renders the R Markdown authoring vignette to HTML and PDF with a range
## of pandoc versions, so template breakages (e.g. pandoc 3.8.2's new
## counter requirement) show up before users hit them.

on:
  push:
    branches: [devel, 'RELEASE_*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: "pandoc ${{ matrix.pandoc }}"
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    strategy:
      fail-fast: false
      matrix:
        pandoc: ['2.19.2', '3.1.13', '3.6.4', '3.8.2', '3.10', 'latest']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ matrix.pandoc }}

      ## Quarto CLI for the Quarto vignette (BiocStyle::quarto_html) and
      ## inst/unitTests/test_quarto.R. quarto-actions/setup needs sudo, jq
      ## and wget, which the container may not have.
      - name: Install Quarto prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends sudo jq wget curl

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX and LaTeX packages
        run: Rscript .github/scripts/install-tex.R

      - name: Install dependencies and this BiocStyle
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never", repos = BiocManager::repositories())'
          Rscript -e 'install.packages("magick")'
          R CMD INSTALL .

      - name: Render HTML and PDF
        working-directory: vignettes
        run: |
          pandoc --version | head -1
          Rscript -e 'rmarkdown::render("AuthoringRmdVignettes.Rmd", output_format = "BiocStyle::html_document", quiet = TRUE)'
          Rscript -e 'rmarkdown::render("AuthoringRmdVignettes.Rmd", output_format = "BiocStyle::pdf_document", quiet = TRUE)'

      ## Structural assertions on the rendered output of the golden fixture
      ## (inst/unitTests/cases/golden.Rmd), run against the installed package.
      ## Runs even if the vignette render failed so every pandoc version
      ## reports its assertion results.
      - name: Golden-output render tests
        if: ${{ !cancelled() }}
        run: |
          Rscript -e '
            library(RUnit)
            library(BiocStyle)
            res <- runTestFile("inst/unitTests/test_render_golden.R")
            printTextProtocol(res, showDetails = TRUE)
            err <- getErrors(res)
            if (err$nErr + err$nFail > 0L) quit(status = 1L)
          '

      ## Quarto renders with its own bundled pandoc, so these steps check the
      ## biocstyle Quarto formats rather than the matrix pandoc version.
      - name: Render the Quarto vignette
        if: ${{ !cancelled() }}
        working-directory: vignettes
        run: |
          quarto --version
          Rscript -e 'library(BiocStyle); tools::buildVignette("AuthoringQuartoVignettes.qmd", tangle = FALSE, quiet = FALSE)'

      - name: Quarto tests
        if: ${{ !cancelled() }}
        run: |
          Rscript -e '
            library(RUnit)
            library(BiocStyle)
            res <- runTestFile("inst/unitTests/test_quarto.R")
            printTextProtocol(res, showDetails = TRUE)
            err <- getErrors(res)
            if (err$nErr + err$nFail > 0L) quit(status = 1L)
          '

      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-pandoc-${{ matrix.pandoc }}
          path: |
            vignettes/*.html
            vignettes/*.pdf
            vignettes/*.log
